<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1280 440" width="1280" height="440" role="img"
     aria-label="Juror — frontier models review your pull request in parallel">
  <title>Juror — frontier models review your pull request in parallel</title>
  <defs>
    <clipPath id="hd-round"><rect width="1280" height="440" rx="24"/></clipPath>

    <linearGradient id="hd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151F"/><stop offset="1" stop-color="#080B11"/>
    </linearGradient>
    <radialGradient id="hd-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2B33D" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#7C6BF0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7C6BF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hd-fade" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="hd-mask"><rect width="1280" height="440" fill="url(#hd-fade)"/></mask>
    <pattern id="hd-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2A3446"/>
    </pattern>

    <linearGradient id="hd-a" gradientUnits="userSpaceOnUse" x1="22" y1="20" x2="54.3" y2="34.2">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#F2B33D"/>
    </linearGradient>
    <linearGradient id="hd-b" gradientUnits="userSpaceOnUse" x1="22" y1="48" x2="50" y2="48">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#F2B33D"/>
    </linearGradient>
    <linearGradient id="hd-c" gradientUnits="userSpaceOnUse" x1="22" y1="76" x2="54.3" y2="61.8">
      <stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#F2B33D"/>
    </linearGradient>
    <linearGradient id="hd-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B33D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2B33D" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2B33D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#hd-round)">
    <rect width="1280" height="440" fill="url(#hd-bg)"/>
    <rect width="1280" height="440" fill="url(#hd-grid)" mask="url(#hd-mask)"/>
    <ellipse cx="640" cy="150" rx="540" ry="240" fill="url(#hd-glow)"/>

    <g transform="translate(429.7 58.2) scale(1.6)">
      <g transform="translate(-10.5 12)">
        <g fill="none" stroke-width="5.5" stroke-linecap="round">
          <path id="hd-p1" d="M22 20C42 20 46.9 29 54.3 34.2" stroke="url(#hd-a)"/>
          <path id="hd-p2" d="M22 48H50" stroke="url(#hd-b)"/>
          <path id="hd-p3" d="M22 76C42 76 46.9 67 54.3 61.8" stroke="url(#hd-c)"/>
        </g>
        <circle cx="22" cy="20" r="6.5" fill="#38BDF8"/>
        <circle cx="22" cy="48" r="6.5" fill="#A78BFA"/>
        <circle cx="22" cy="76" r="6.5" fill="#F472B6"/>
        <circle cx="74" cy="48" r="15.5" fill="none" stroke="#F2B33D" stroke-width="5"/>

        <!-- Ambient: findings travelling to the verdict. Starts hidden, so a renderer
             that strips SMIL shows the static mark rather than three stray dots. -->
        <circle cx="74" cy="48" r="15.5" fill="none" stroke="#F2B33D" stroke-width="2.5" opacity="0">
          <animate attributeName="r" values="15.5;29" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.5;0" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle r="3.4" fill="#FFE3A8" opacity="0">
          <animateMotion dur="2.8s" begin="0s" repeatCount="indefinite"><mpath href="#hd-p1" xlink:href="#hd-p1"/></animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.8s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <circle r="3.4" fill="#FFE3A8" opacity="0">
          <animateMotion dur="2.8s" begin="0.45s" repeatCount="indefinite"><mpath href="#hd-p2" xlink:href="#hd-p2"/></animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.8s" begin="0.45s" repeatCount="indefinite"/>
        </circle>
        <circle r="3.4" fill="#FFE3A8" opacity="0">
          <animateMotion dur="2.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#hd-p3" xlink:href="#hd-p3"/></animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g transform="translate(105 37) scale(0.42)">
        <g fill="none" stroke="#E9EFF6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 8V110a22 22 0 0 1-22 22"/>
          <path d="M64 8v54a30 30 0 0 0 60 0V8"/>
          <path d="M156 92V8m0 26a26 26 0 0 1 26-26"/>
          <path d="M330 92V8m0 26a26 26 0 0 1 26-26"/>
        </g>
        <circle cx="30" cy="-24" r="7" fill="#E9EFF6"/>
        <circle cx="256" cy="50" r="42" fill="none" stroke="#F2B33D" stroke-width="14"/>
      </g>
    </g>

    <g text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
      <text x="640" y="284" font-size="28" fill="#C8D4E4">Frontier models review your pull request in parallel.</text>
      <text x="640" y="322" font-size="18" fill="#7B889D">Duplicate findings collapse into one. Every review prints its own receipt.</text>
    </g>
    <rect x="530" y="350" width="220" height="1" fill="url(#hd-rule)"/>
    <text x="640" y="386" text-anchor="middle" font-size="13" letter-spacing="3.2" fill="#5A6779"
          font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace">CODEX · CLAUDE CODE · OPENCODE · GROK BUILD · KIMI CODE</text>
  </g>
</svg>
