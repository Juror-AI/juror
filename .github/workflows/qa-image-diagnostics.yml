name: QA image diagnostics

on:
  pull_request:
    paths:
      - 'qa/**'
      - 'src/qa/**'
      - 'test/qa-agent.test.ts'
      - '.github/workflows/qa-image-diagnostics.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build QA image for native amd64
        run: docker build --file qa/Dockerfile --tag juror-qa:diagnostic .

      - name: Compare hardened Chromium launch variants
        shell: bash
        run: |
          set -uo pipefail
          jq '(.syscalls[] | select(.comment == "Allow create user namespaces") | .names) += ["clone3"]' \
            qa/seccomp_profile.json > "$RUNNER_TEMP/seccomp-clone3.json"

          browser='import("/opt/juror/node_modules/playwright/index.mjs").then(({chromium}) => chromium.launch({headless:true,channel:"chromium",chromiumSandbox:process.env.JUROR_DIAGNOSTIC_SANDBOX!=="false"})).then(async browser => { console.log(`sandboxed Chromium ${browser.version()}`); await browser.close(); }).catch(error => { console.error(error); process.exit(1); })'
          common=(
            --rm
            --init
            --read-only
            --tmpfs /tmp:rw,nosuid,nodev,size=256m
            --shm-size=1g
            --user pwuser
            --cap-drop=ALL
            --cap-add=SYS_CHROOT
            --pids-limit=256
            --memory=2g
            --cpus=2
            --entrypoint node
          )

          run_variant() {
            local name="$1"
            shift
            echo "::group::$name"
            set +e
            timeout 90s docker run "${common[@]}" "$@" juror-qa:diagnostic -e "$browser"
            local status=$?
            set -e
            echo "variant=$name status=$status"
            echo '::endgroup::'
          }

          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/pwuser:rw,nosuid,nodev,size=64m \
            --user pwuser \
            --entrypoint stat \
            juror-qa:diagnostic -c '%A %u:%g %n' /tmp /home/pwuser

          run_variant exact \
            --tmpfs /home/pwuser:rw,nosuid,nodev,size=64m \
            --security-opt seccomp=qa/seccomp_profile.json
          run_variant writable-home \
            --env HOME=/home/pwuser \
            --tmpfs /home/pwuser:rw,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=0700 \
            --security-opt seccomp=qa/seccomp_profile.json
          run_variant writable-xdg \
            --env HOME=/tmp/home \
            --env XDG_CONFIG_HOME=/tmp/config \
            --env XDG_CACHE_HOME=/tmp/cache \
            --tmpfs /home/pwuser:rw,nosuid,nodev,size=64m \
            --security-opt seccomp=qa/seccomp_profile.json
          run_variant clone3 \
            --tmpfs /home/pwuser:rw,nosuid,nodev,size=64m \
            --security-opt "seccomp=$RUNNER_TEMP/seccomp-clone3.json"
          run_variant no-seccomp \
            --tmpfs /home/pwuser:rw,nosuid,nodev,size=64m
          run_variant sandbox-off \
            --env JUROR_DIAGNOSTIC_SANDBOX=false \
            --tmpfs /home/pwuser:rw,nosuid,nodev,size=64m \
            --security-opt seccomp=qa/seccomp_profile.json
